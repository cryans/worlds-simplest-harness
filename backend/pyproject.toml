[project]
name = "wsh"
version = "0.1.0"
description = "World's Simplest Harness — backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "httpx==0.28.1",
    "python-dotenv==1.0.1",
    "pydantic==2.14.1",
]

[dependency-groups]
dev = ["pytest==8.3.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wsh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
